<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lychee-Chat · 无法在此页面打开</title>
<style>
  :root {
    --ink: #241b17;
    --paper: #fffaf5;
    --bg: #f2ece4;
    --line: #e5d8cb;
    --muted: #6b594f;
    --faint: #79675c;
    --accent: #d47b68;
    --accent-soft: #f7e5df;
    --font: "Inter", "SF Pro Text", "PingFang SC", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(rgba(36, 27, 23, .035) .5px, transparent .5px) 0 0 / 8px 8px,
      var(--bg);
    color: var(--ink);
    font-family: var(--font);
  }
  .card {
    width: 100%;
    max-width: 430px;
    padding: 26px 24px 22px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--paper);
    box-shadow: 0 30px 70px -40px rgba(36, 22, 15, .4);
  }
  .icon {
    display: grid;
    width: 46px;
    height: 46px;
    place-items: center;
    margin-bottom: 16px;
    border-radius: 14px;
    background: var(--accent-soft);
    color: #a8463c;
    font-size: 22px;
    font-weight: 700;
  }
  .kicker {
    color: var(--faint);
    font-size: 9px;
    font-weight: 650;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  h1 { margin: 7px 0 8px; font-size: 21px; line-height: 1.25; letter-spacing: -.04em; }
  p { margin: 0 0 12px; color: var(--muted); font-size: 11.5px; line-height: 1.65; }
  .reason {
    margin: 14px 0;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--bg);
    color: var(--ink);
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 10px;
    line-height: 1.55;
    overflow-wrap: anywhere;
  }
  .url { color: var(--faint); font-size: 9px; overflow-wrap: anywhere; }
  ul { margin: 8px 0 16px; padding-left: 17px; color: var(--muted); font-size: 11px; line-height: 1.7; }
  li::marker { color: var(--accent); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; }
  button {
    height: 34px;
    padding: 0 13px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font: inherit;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary { border-color: var(--ink); background: var(--ink); color: var(--paper); }
  button:hover { filter: brightness(.98); }
  .foot { margin-top: 14px; color: var(--faint); font-size: 8.5px; }
</style>
</head>
<body>
  <main class="card">
    <div class="icon">!</div>
    <div class="kicker">Lychee-Chat</div>
    <h1>这个页面不允许打开聊天浮窗</h1>
    <p>Chrome 禁止扩展在内部页面、应用商店、PDF 阅读器和部分受保护页面注入脚本。这是浏览器安全限制，不是聊天模型的问题。</p>
    <div class="reason" id="reason">正在获取原因…</div>
    <p class="url" id="page"></p>
    <ul>
      <li>打开一个普通网站（例如 <code>https://example.com</code>）再点击工具栏图标。</li>
      <li>如果你在本地 HTML 文件上测试，请改用本地 HTTP 服务，或在扩展详情中开启“允许访问文件网址”。</li>
      <li>设置页本身也不需要浮窗：配置保存后回到网页再点图标。</li>
    </ul>
    <div class="actions">
      <button type="button" id="settings">打开设置</button>
      <button type="button" class="primary" id="close">知道了</button>
    </div>
    <p class="foot">提示：设置页和聊天页是扩展页面，直接从文件夹双击打开无法访问扩展 API。</p>
  </main>
  <script src="fallback.js"></script>
</body>
</html>
